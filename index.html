<!-- @dsCard group="Landing" viewport="1360x900" name="Landing page" subtitle="Casa Jaguar — propuesta visual (hero)" -->
<!-- @startingPoint section="Landing" subtitle="Casa Jaguar landing page — full scroll" viewport="1360x900" -->
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Casa Jaguar — Interiorismo & Dirección Creativa</title>
<link rel="stylesheet" href="./styles.css">
<script src="./_ds_bundle.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="https://unpkg.com/lenis@1/dist/lenis.min.js"></script>
<style>
  html,body{margin:0;background:var(--cj-white)}
  img{max-width:100%}
  a{color:var(--cj-ink);text-decoration:none}
  a:not(.cj-herosplit-panel):not(.cj-cat):hover{color:var(--cj-brick)}
  /* Tipografía — jerarquía por peso (pedido del cliente): títulos Rubik Bold,
     subtítulos Medium, cuerpo Regular. Los pesos inline en el JSX lo confirman. */
  h1,h2,h3,h4,h5,h6{font-family:var(--cj-font)}
  h1,h2,h3{font-weight:var(--cj-w-bold)}
  h4,h5,h6{font-weight:var(--cj-w-medium)}
  /* Lenis — smooth scroll */
  html.lenis,html.lenis body{height:auto}
  .lenis.lenis-smooth{scroll-behavior:auto !important}
  .lenis.lenis-smooth [data-lenis-prevent]{overscroll-behavior:contain}
  .lenis.lenis-stopped{overflow:hidden}
  .lenis.lenis-smooth iframe{pointer-events:none}
  /* Home — Pantalla 1: dos bloques (Proyectos / Tienda) */
  .cj-herosplit{display:grid;grid-template-columns:1fr 1fr;min-height:calc(100svh - 77px)}
  .cj-herosplit-panel{position:relative;overflow:hidden;display:flex;align-items:flex-end;min-height:56vh;color:var(--cj-paper);text-decoration:none}
  .cj-herosplit-panel:first-child{border-right:1px solid rgba(243,239,230,0.16)}
  /* Slider del home — carrusel horizontal con autoplay + infinite loop (bloque de 4
     imágenes, ~3s c/u). El texto queda fijo; solo se desliza la banda de fotos. */
  .cj-herosplit-slides{position:absolute;inset:0;overflow:hidden}
  .cj-hero-track{display:flex;height:100%;width:100%;will-change:transform}
  .cj-hero-slide{flex:0 0 100%;width:100%;height:100%;object-fit:cover;transform:scale(1.02);transition:transform 1.3s cubic-bezier(.2,.6,.2,1);user-select:none;-webkit-user-drag:none}
  .cj-herosplit-panel:hover .cj-hero-slide{transform:scale(1.06)}
  .cj-hero-dots{position:absolute;z-index:2;right:clamp(1.1rem,3vw,2.2rem);bottom:clamp(1.1rem,3vw,1.9rem);display:flex;gap:9px}
  .cj-hero-dot{width:7px;height:7px;border-radius:50%;background:rgba(243,239,230,0.42);transition:background var(--cj-dur) var(--cj-ease),transform var(--cj-dur) var(--cj-ease)}
  .cj-hero-dot.is-active{background:var(--cj-paper);transform:scale(1.3)}
  .cj-herosplit-panel:hover,.cj-herosplit-panel:hover .cj-herosplit-title,.cj-herosplit-panel:hover .cj-cta-label{color:var(--cj-paper) !important}
  /* Scrim del hero — oscuridad justa para legibilidad, CONSTANTE (no cambia en hover) */
  .cj-herosplit-scrim{position:absolute;inset:0;background:linear-gradient(to top,rgba(28,24,21,0.5) 0%,rgba(28,24,21,0.22) 52%,rgba(28,24,21,0.28) 100%)}
  .cj-herosplit-inner{position:relative;padding:clamp(2rem,5vw,4rem);max-width:44ch}
  .cj-herosplit-title{margin:.6rem 0 0;font-family:var(--cj-font-display);font-weight:var(--cj-w-bold);font-size:clamp(2.6rem,5.2vw,4.2rem);line-height:1;letter-spacing:-0.01em}
  .cj-herosplit-line{margin:1rem 0 0;font-weight:var(--cj-w-regular);font-size:var(--cj-t-body-lg);line-height:1.42;color:rgba(243,239,230,0.82)}
  .cj-herosplit-cta{display:inline-flex;align-items:center;gap:10px;margin-top:1.6rem;font-family:var(--cj-font-ui);font-size:13px;letter-spacing:0.16em;text-transform:uppercase}
  .cj-cta-label{box-shadow:inset 0 -1px 0 rgba(243,239,230,0.5);padding-bottom:2px}
  .cj-cta-arrow{display:inline-flex;align-items:center;transition:transform var(--cj-dur) var(--cj-ease)}
  .cj-herosplit-panel:hover .cj-cta-arrow{transform:translateX(6px)}
  /* Nosotros — fotografía blurreada de fondo + texto (pedido del cliente) */
  .cj-about{position:relative;overflow:hidden;background:var(--cj-ink);padding-top:var(--cj-section-y);padding-bottom:var(--cj-section-y)}
  .cj-about-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(22px) saturate(1.05);transform:scale(1.15);opacity:.9}
  .cj-about-scrim{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(28,24,21,0.72),rgba(28,24,21,0.82))}
  .cj-about-inner{max-width:900px;margin:0 auto;text-align:center}
  .cj-about-lead{margin:1.8rem 0 0;font-family:var(--cj-font-display);font-weight:var(--cj-w-medium);font-size:clamp(1.4rem,2.4vw,2.05rem);line-height:1.42;letter-spacing:-0.01em;color:var(--cj-paper)}
  /* Tienda — categorías (foto + categoría FUERA de la imagen, formato editorial) */
  .cj-catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(1.2rem,2.5vw,2rem)}
  .cj-cat{display:block;text-decoration:none;color:var(--cj-ink)}
  .cj-cat-photo{position:relative;overflow:hidden;border-radius:var(--cj-radius);aspect-ratio:4/5;background:var(--cj-stone-100);border:1px solid var(--cj-line)}
  .cj-cat-photo img{width:100%;height:100%;object-fit:cover;display:block;transition:transform var(--cj-dur-slow) var(--cj-ease)}
  .cj-cat-meta{padding-top:.9rem}
  .cj-cat-name{font-family:var(--cj-font-serif);font-weight:var(--cj-w-medium);font-size:1.3rem;line-height:1.2;color:var(--cj-ink)}
  .cj-cat-subline{margin-top:.45rem;font-family:var(--cj-font-ui);font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--cj-text-subtle)}
  .cj-product-cta{display:inline-flex;align-items:center;gap:8px;margin-top:.85rem;font-family:var(--cj-font-ui);font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:var(--cj-ink);transition:color var(--cj-dur-fast) var(--cj-ease)}
  .cj-product-cta:hover{color:var(--cj-brick)}
  /* Tienda — drill-down categoría → productos (misma grilla) + animación fade-up */
  button.cj-cat{display:flex;flex-direction:column;border:0;background:none;padding:0;margin:0;font:inherit;text-align:left;width:100%;cursor:pointer;color:var(--cj-ink)}
  .cj-shop-view{animation:cjFade .5s cubic-bezier(.2,.6,.2,1) both}
  .cj-shop-head-row{display:flex;justify-content:space-between;align-items:center;gap:24px}
  .cj-shop-back{display:inline-flex;align-items:center;gap:8px;border:0;background:none;padding:0;font-family:var(--cj-font-ui);font-size:12px;letter-spacing:0.16em;text-transform:uppercase;color:var(--cj-ink);cursor:pointer;white-space:nowrap;transition:color var(--cj-dur-fast) var(--cj-ease)}
  .cj-shop-back:hover{color:var(--cj-brick)}
  .cj-shop-back-arrow{display:inline-flex;transform:scaleX(-1);transition:transform var(--cj-dur) var(--cj-ease)}
  .cj-shop-back:hover .cj-shop-back-arrow{transform:scaleX(-1) translateX(4px)}
  .cj-shop-enter>*{opacity:0;animation:cjHeroUp .6s cubic-bezier(.2,.6,.2,1) forwards}
  .cj-shop-enter>*:nth-child(1){animation-delay:.03s}
  .cj-shop-enter>*:nth-child(2){animation-delay:.09s}
  .cj-shop-enter>*:nth-child(3){animation-delay:.15s}
  .cj-shop-enter>*:nth-child(4){animation-delay:.21s}
  .cj-shop-enter>*:nth-child(5){animation-delay:.27s}
  .cj-shop-enter>*:nth-child(6){animation-delay:.33s}
  .cj-shop-enter>*:nth-child(7){animation-delay:.39s}
  .cj-shop-enter>*:nth-child(8){animation-delay:.45s}
  /* Proyectos — drill-down (dos pasos como Tienda): galería + descripción inline */
  .cj-gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(0.9rem,2vw,1.4rem)}
  .cj-gallery-item{display:block;padding:0;margin:0;border:1px solid var(--cj-line);background:var(--cj-stone-100);border-radius:var(--cj-radius);overflow:hidden;cursor:zoom-in;aspect-ratio:4/3}
  .cj-gallery-item img{width:100%;height:100%;object-fit:cover;display:block;transition:transform var(--cj-dur-slow) var(--cj-ease)}
  .cj-gallery-item:hover img{transform:scale(1.04)}
  @media(max-width:900px){.cj-gallery{grid-template-columns:1fr 1fr}}
  .cj-project-desc{margin:clamp(0.9rem,1.8vw,1.25rem) 0 0;max-width:62ch;font-size:var(--cj-t-body);line-height:1.65;color:var(--cj-ink-soft)}
  /* Hero split (legacy) */
  .cj-hero{display:grid;grid-template-columns:1.05fr 0.95fr;gap:clamp(2rem,6vw,6rem);align-items:center}
  /* Generic two-column */
  .cj-two{display:grid;grid-template-columns:1fr 1fr;gap:clamp(2rem,6vw,5rem)}
  .cj-advisory{display:grid;grid-template-columns:0.82fr 1.18fr;grid-template-areas:"intro media" "actions media";column-gap:clamp(2rem,6vw,5rem);row-gap:2.2rem;align-items:stretch}
  .cj-advisory-intro{grid-area:intro}
  .cj-advisory-actions{grid-area:actions}
  .cj-advisory-media{grid-area:media;position:relative;overflow:hidden;border-radius:var(--cj-radius);background:var(--cj-stone-100);min-height:340px}
  .cj-advisory-media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .cj-grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(1.2rem,2.5vw,2rem)}
  .cj-works-a{display:grid;grid-template-columns:1fr 1fr;gap:clamp(1.2rem,2.5vw,2rem)}
  .cj-works-b{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(1.2rem,2.5vw,2rem)}
  .cj-footer{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:clamp(2rem,5vw,3rem)}
  .cj-burger{display:none}
  .cj-navlinks a{color:var(--cj-ink);transition:color var(--cj-dur-fast) var(--cj-ease)}
  .cj-navlinks a:hover{color:var(--cj-brick)}
  .cj-header-cta:hover{background:var(--cj-brick) !important;border-color:var(--cj-brick) !important}
  .cj-advisory-escribinos:hover{background:var(--cj-paper) !important;color:var(--cj-ink) !important;border-color:var(--cj-paper) !important}
  .cj-footer-link{transition:color var(--cj-dur-fast) var(--cj-ease)}
  .cj-footer-link:hover{color:var(--cj-brick) !important}
  @media(max-width:1040px){
    .cj-navlinks,.cj-navcta{display:none !important}
    .cj-burger{display:flex !important}
  }
  @keyframes cjMenuSlideDown{from{max-height:0;opacity:.5}to{max-height:32rem;opacity:1}}
  @keyframes cjMenuSlideUp{from{max-height:32rem;opacity:1}to{max-height:0;opacity:0}}
  @keyframes cjMenuLinkIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  .cj-mobilemenu{overflow:hidden;position:absolute;top:100%;left:0;right:0;z-index:35;box-shadow:0 18px 40px rgba(28,24,21,0.12)}
  .cj-mobilemenu-in{animation:cjMenuSlideDown .44s cubic-bezier(.65,0,.35,1) both}
  .cj-mobilemenu-out{animation:cjMenuSlideUp .36s cubic-bezier(.65,0,.35,1) both}
  .cj-mobilemenu-in a{opacity:0;animation:cjMenuLinkIn .4s cubic-bezier(.2,.6,.2,1) forwards}
  .cj-mobilemenu-in a:nth-child(1){animation-delay:.1s}
  .cj-mobilemenu-in a:nth-child(2){animation-delay:.16s}
  .cj-mobilemenu-in a:nth-child(3){animation-delay:.22s}
  .cj-mobilemenu-in a:nth-child(4){animation-delay:.28s}
  .cj-mobilemenu-in a:nth-child(5){animation-delay:.34s}
  @keyframes cjFade{from{opacity:0}to{opacity:1}}
  @keyframes cjHeroUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .cj-hero-in>*{animation:cjHeroUp 1.5s cubic-bezier(.2,.6,.2,1) both}
  .cj-hero-in>*:nth-child(2){animation-delay:.1s}
  .cj-hero-in>*:nth-child(3){animation-delay:.2s}
  .cj-hero-in>*:nth-child(4){animation-delay:.3s}
  .cj-reveal{opacity:0;transform:translateY(12px);transition:opacity 1.5s cubic-bezier(.2,.6,.2,1),transform 1.5s cubic-bezier(.2,.6,.2,1)}
  .cj-reveal.in{opacity:1;transform:none}
  .cj-stagger>*{opacity:0;transform:translateY(10px);transition:opacity 1.35s cubic-bezier(.2,.6,.2,1),transform 1.35s cubic-bezier(.2,.6,.2,1)}
  .cj-stagger.in>*{opacity:1;transform:none}
  .cj-stagger.in>*:nth-child(2){transition-delay:.08s}
  .cj-stagger.in>*:nth-child(3){transition-delay:.16s}
  .cj-stagger.in>*:nth-child(4){transition-delay:.24s}
  .cj-stagger.in>*:nth-child(5){transition-delay:.32s}
  .cj-stagger.in>*:nth-child(6){transition-delay:.4s}
  .cj-word{display:inline-block;opacity:0;transform:translateY(10px);transition:opacity 1.3s cubic-bezier(.2,.6,.2,1),transform 1.3s cubic-bezier(.2,.6,.2,1)}
  .cj-wordblock.in .cj-word{opacity:1;transform:none}
  @media(prefers-reduced-motion:reduce){
    .cj-reveal,.cj-stagger>*,.cj-word{opacity:1 !important;transform:none !important;transition:none !important}
    .cj-hero-in>*,.cj-shop-view,.cj-shop-back{animation:none !important}
    .cj-shop-enter>*{opacity:1 !important;transform:none !important;animation:none !important}
  }
  .cj-lbarrow:hover{background:rgba(160,42,32,0.85) !important}
  .cj-section-anchor{scroll-margin-top:100px}
  .cj-services .cj-service:last-child{border-bottom:0}
  .cj-photo{position:relative}
  .cj-photo::after{content:"";position:absolute;inset:0;background:linear-gradient(to top, rgba(28,24,21,0.42) 0%, rgba(28,24,21,0.12) 40%, rgba(28,24,21,0) 70%);opacity:1;transition:opacity .7s cubic-bezier(.2,.6,.2,1);pointer-events:none;z-index:1}
  .cj-photo:hover::after{opacity:0}
  #cj-scroll>section:nth-of-type(2)>.cj-reveal{transition-duration:1.9s}
  @media(max-width:900px){
    .cj-hero{grid-template-columns:1fr;gap:2.5rem}
    .cj-two{grid-template-columns:1fr;gap:2rem}
    .cj-advisory{grid-template-columns:1fr;grid-template-areas:"intro" "media" "actions";row-gap:1.8rem}
    .cj-advisory-media{min-height:0;aspect-ratio:4 / 3}
    .cj-about-grid{grid-template-columns:1fr;gap:2.5rem}
    .cj-grid3,.cj-works-b{grid-template-columns:1fr 1fr}
    .cj-works-a{grid-template-columns:1fr}
    .cj-catgrid{grid-template-columns:1fr 1fr}
    .cj-footer{grid-template-columns:1fr 1fr}
    .cj-service{grid-template-columns:1fr !important;gap:6px !important}
    .cj-service p{display:block !important}
    .cj-navlinks,.cj-navcta{display:none !important}
    .cj-burger{display:flex !important}
  }
  @media(max-width:820px){
    .cj-herosplit{grid-template-columns:1fr}
    .cj-herosplit-panel{min-height:48vh}
    .cj-herosplit-panel:first-child{border-right:0;border-bottom:1px solid rgba(243,239,230,0.16)}
    .cj-herosplit-inner .cj-eyebrow{font-size:11px;letter-spacing:0.14em}
    .cj-herosplit-cta{margin-top:1.2rem;padding:11px 0}
    .cj-manifesto{padding-top:var(--cj-section-y) !important;padding-bottom:var(--cj-section-y) !important}
  }
  @media(max-width:560px){
    .cj-grid3,.cj-footer{grid-template-columns:1fr}
  }
  @media(max-width:640px){
    .cj-catgrid,.cj-works-b{
      display:flex;grid-template-columns:none;overflow-x:auto;gap:1rem;
      scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;
      padding-bottom:.6rem;scroll-padding-left:var(--cj-gutter)
    }
    .cj-catgrid>*,.cj-works-b>*{flex:0 0 74%;scroll-snap-align:start}
    .cj-catgrid::-webkit-scrollbar,.cj-works-b::-webkit-scrollbar{height:0}
    .cj-service h3{font-size:1.65rem !important}
    .cj-footer-legal{margin-top:var(--cj-space-6) !important}
  }
</style>
</head>
<body>
<div id="root"></div>
<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#a02a20"/><text x="50" y="58" font-family="Georgia, serif" font-style="italic" font-size="20" fill="#f3efe6" text-anchor="middle">cj</text></svg></template>
<script src="landing-app.jsx" type="text/babel" data-presets="react"></script>
<script type="text/babel" data-presets="react">
  ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(window.CJApp));
</script>
<script>
  (function () {
    var lenis = null;
    if (window.Lenis) {
      lenis = new Lenis({
        duration: 1.1,
        easing: function (t) { return Math.min(1, 1.001 - Math.pow(2, -10 * t)); },
        smoothWheel: true
      });
      window.lenis = lenis;
      function raf(time) { lenis.raf(time); requestAnimationFrame(raf); }
      requestAnimationFrame(raf);
    }
    document.addEventListener('click', function (e) {
      var a = e.target.closest && e.target.closest('a[href^="#"]');
      if (!a) return;
      var id = a.getAttribute('href');
      if (!id || id.length < 2) return;
      var target = document.getElementById(id.slice(1));
      if (!target) return;
      e.preventDefault();
      var top = id === '#top' ? 0 : target.getBoundingClientRect().top + window.scrollY - 100;
      if (lenis) lenis.scrollTo(top);
      else window.scrollTo({ top: top, behavior: 'smooth' });
      history.replaceState(null, '', id);
    });
  })();
</script>
</body>
</html>
